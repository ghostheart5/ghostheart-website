name: Website checks
on:
  pull_request:
    branches: [main]
  push:
    branches: ["codex/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed generator dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0 beautifulsoup4==4.13.5
      - name: Build the single complete website pipeline
        run: python3 .github/scripts/build_site.py
      - name: Validate generated site tree
        run: python3 .github/scripts/validate_site.py
      - name: Verify reviewed content and campaign boundaries
        run: |
          python3 .github/scripts/test_awakening.py
          python3 .github/scripts/verify_reviewed_site.py
          python3 .github/scripts/verify_world_review.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do node --check "$script"; done < <(find assets -type f -name '*.js' -print0)
          node .github/scripts/test_vault_filters.cjs
      - name: Install browser for local page checks
        run: |
          npm install --prefix /tmp/gh-browser --no-audit --no-fund playwright@1.55.1
          /tmp/gh-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check key pages in a browser without external requests
        env:
          NODE_PATH: /tmp/gh-browser/node_modules
        run: |
          python3 -m http.server 8765 > /tmp/ghostheart-review-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node .github/scripts/test_reviewed_site.cjs
