name: Website checks
on:
  pull_request:
    branches: [main]
  push:
    branches: ["codex/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed generator dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0 beautifulsoup4==4.13.5
      - name: Build the single complete website pipeline
        run: python3 .github/scripts/finish_gateway.py
      - name: Validate generated site tree
        run: python3 .github/scripts/validate_site.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do node --check "$script"; done < <(find assets -type f -name '*.js' -print0)
