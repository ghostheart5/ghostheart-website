name: Website checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "phase0/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required website files
        run: |
          set -euo pipefail
          required_files=(
            index.html
            CNAME
            ghostheart-website/index.html
            ghostheart-website/css/ghostheart.css
            ghostheart-website/js/ghostheart.js
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing required file: $file" >&2
              exit 1
            }
          done

      - name: Detect unresolved merge conflict markers
        run: |
          set -euo pipefail
          if grep -RInE \
            --include='*.html' \
            --include='*.css' \
            --include='*.js' \
            '^(<<<<<<<|=======|>>>>>>>)' \
            .; then
            echo "Unresolved merge conflict markers found." >&2
            exit 1
          fi

      - name: Check local HTML links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          ROOT = Path.cwd().resolve()
          SKIPPED_SCHEMES = {"data", "http", "https", "javascript", "mailto", "tel"}

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.links.append(href)

          missing = []
          for html_file in ROOT.rglob("*.html"):
              parser = LinkParser()
              parser.feed(html_file.read_text(encoding="utf-8"))
              for href in parser.links:
                  parts = urlsplit(href)
                  if parts.scheme.lower() in SKIPPED_SCHEMES or parts.netloc:
                      continue
                  target = unquote(parts.path)
                  if not target:
                      continue
                  candidate = (
                      ROOT / target.lstrip("/")
                      if target.startswith("/")
                      else html_file.parent / target
                  ).resolve()
                  if ROOT not in candidate.parents and candidate != ROOT:
                      missing.append((html_file.relative_to(ROOT), href, "escapes repository"))
                  elif not candidate.exists():
                      missing.append((html_file.relative_to(ROOT), href, "missing target"))

          if missing:
              for source, href, reason in missing:
                  print(f"{source}: {href} ({reason})")
              raise SystemExit(1)
          PY

      - name: Check website JavaScript syntax
        run: node --check ghostheart-website/js/ghostheart.js

      - name: Prevent false email signup confirmation
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html_path = Path("ghostheart-website/index.html")
          javascript_path = Path("ghostheart-website/js/ghostheart.js")
          html = html_path.read_text(encoding="utf-8")
          javascript = javascript_path.read_text(encoding="utf-8")
          notice = "Email signup is being connected. No address is collected yet."
          old_success = "You are in. New GhostHeart signals will find you."

          email_input = re.search(r'<input\b[^>]*\bid="email"[^>]*>', html, re.S)
          submit_button = re.search(r'<button\b[^>]*\btype="submit"[^>]*>', html, re.S)

          errors = []
          if notice not in html:
              errors.append("Missing visible email-signup unavailable notice.")
          if old_success in html or old_success in javascript:
              errors.append("Found the retired email-signup success message.")
          if '.addEventListener("submit"' in javascript or ".addEventListener('submit'" in javascript:
              errors.append("Client-side submit handling is not allowed before persistence exists.")
          for element, label in ((email_input, "email input"), (submit_button, "submit button")):
              if element is None or not re.search(r'\bdisabled\b', element.group(0)):
                  errors.append(f"The {label} must remain disabled.")
              if element is None or 'aria-describedby="signup-unavailable"' not in element.group(0):
                  errors.append(f"The {label} must describe the unavailable state.")

          if errors:
              for error in errors:
                  print(error)
              raise SystemExit(1)
          PY
